services:
  # ───── Backend (FastAPI) ─────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: researchswarm-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/results:/app/backend/results
    restart: unless-stopped

  # ───── Frontend (Vite + React) ─────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: researchswarm-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
